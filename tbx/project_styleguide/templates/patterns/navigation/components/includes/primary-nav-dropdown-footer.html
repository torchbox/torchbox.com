{% if dropdown.parent_url %}
    <div class="primary-nav-dropdown__footer">
        <a href="{{ dropdown.parent_url }}" class="primary-nav-dropdown__footer-link">
            <span class="primary-nav-dropdown__footer-text">View all {{ dropdown.parent_text|lower }}</span>
            <span class="primary-nav-dropdown__footer-tail">&nbsp;{% include "patterns/atoms/icons/icon.html" with name="arrow" classname="primary-nav-dropdown__footer-arrow" %}</span>
        </a>
    </div>
{% endif %}
