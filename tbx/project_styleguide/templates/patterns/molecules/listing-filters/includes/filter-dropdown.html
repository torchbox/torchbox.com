{% load util_tags %}

{% if options %}
<div class="listing-filters__dropdown" data-listing-filter-dropdown>
    <button
        type="button"
        class="listing-filters__dropdown-toggle"
        data-listing-filter-toggle
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-controls="listing-filter-{{ id_param|default:param }}"
        id="listing-filter-toggle-{{ id_param|default:param }}"
    >
        <span class="listing-filters__dropdown-label">{{ label }}</span>
        <span class="listing-filters__dropdown-indicator">
            <span class="listing-filters__dropdown-count" data-listing-filter-count{% if not selected_count %} hidden{% endif %}>
                {{ selected_count }}
            </span>
            {% include "patterns/atoms/icons/icon.html" with name="chevron" classname="listing-filters__dropdown-icon" %}
        </span>
    </button>
    <div
        class="listing-filters__dropdown-panel"
        id="listing-filter-{{ id_param|default:param }}"
        role="listbox"
        aria-labelledby="listing-filter-toggle-{{ id_param|default:param }}"
        aria-multiselectable="true"
        data-listing-filter-panel
        hidden
    >
        <ul class="listing-filters__options">
            {% for option in options %}
                {% include "patterns/molecules/listing-filters/includes/filter-option.html" with value=option.value label=option.label %}
            {% endfor %}
        </ul>
    </div>
</div>
{% endif %}
