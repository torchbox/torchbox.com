{% comment %}
Simple listing heading (Work, News, Events). Grid placement comes from
`grid__listing-header` (see components/_grid.scss); the filters sit below it in
`grid__listing-panel`.
{% endcomment %}
<div class="listing-header grid__listing-header mb-spacerSmallPlus lg:mb-spacerMedium">
    <h1 class="heading heading--mega">{{ item.title }}</h1>
    {% if strapline %}
        <p class="listing-header__strapline mt-spacerSmallPlus">{{ strapline }}</p>
    {% endif %}
</div>
