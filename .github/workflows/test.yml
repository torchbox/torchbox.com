name: CI

on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      # Reads the pnpm version from package.json (devEngines.packageManager, then packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
  test_js:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json (devEngines.packageManager, then packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
  compile_static:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json (devEngines.packageManager, then packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: tbx/static_compiled/
  test_python:
    needs: [lint, compile_static]
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: tbx.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost/postgres # pragma: allowlist secret
      CFG_SECRET_KEY: iamnotsosecret # pragma: allowlist secret
      CFG_ALLOWED_HOSTS: localhost

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9' # Make sure this matches UV_VERSION in the Dockerfile
          python-version: '3.15'
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: tbx/static_compiled/
      - name: Install Python dependencies
        run: uv sync
      - name: collectstatic
        run: uv run ./manage.py collectstatic --verbosity 0 --noinput --clear
      - name: System checks
        run: uv run ./manage.py check
      - name: Check for missing migrations
        run: uv run ./manage.py makemigrations --check --noinput
      - name: Create cache table
        run: uv run ./manage.py createcachetable
      - name: Test
        run: uv run ./manage.py test
