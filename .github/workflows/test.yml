name: CI

on:
  push:
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable pnpm via corepack
        run: npm install -g corepack@0.36.0 && corepack enable pnpm && corepack prepare "pnpm@12.18.0+sha512.9d7882d5dc82147ecfc4e062aa34834e0ad0296710a1837a1115ae012127d36b7109e321ac1598a1dd0a65597681b1e99917e12ed0d749eae91187943363beb3" --activate
      - id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/.nvmrc') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.node-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@v3.0.1
  test_js:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable pnpm via corepack
        run: npm install -g corepack@0.36.0 && corepack enable pnpm && corepack prepare "pnpm@12.18.0+sha512.9d7882d5dc82147ecfc4e062aa34834e0ad0296710a1837a1115ae012127d36b7109e321ac1598a1dd0a65597681b1e99917e12ed0d749eae91187943363beb3" --activate
      - id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/.nvmrc') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.node-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm run test
  compile_static:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Enable pnpm via corepack
        run: npm install -g corepack@0.36.0 && corepack enable pnpm && corepack prepare "pnpm@12.18.0+sha512.9d7882d5dc82147ecfc4e062aa34834e0ad0296710a1837a1115ae012127d36b7109e321ac1598a1dd0a65597681b1e99917e12ed0d749eae91187943363beb3" --activate
      - id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/.nvmrc') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - if: steps.node-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: static
          path: tbx/static_compiled/
  test_python:
    needs: [lint, compile_static]
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: tbx.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost/postgres # pragma: allowlist secret
      CFG_SECRET_KEY: iamnotsosecret # pragma: allowlist secret
      CFG_ALLOWED_HOSTS: localhost

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7' # Make sure this matches UV_VERSION in the Dockerfile
          python-version: '3.15'
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: static
          path: tbx/static_compiled/
      - name: Install Python dependencies
        run: uv sync
      - name: collectstatic
        run: uv run ./manage.py collectstatic --verbosity 0 --noinput --clear
      - name: System checks
        run: uv run ./manage.py check
      - name: Check for missing migrations
        run: uv run ./manage.py makemigrations --check --noinput
      - name: Create cache table
        run: uv run ./manage.py createcachetable
      - name: Test
        run: uv run ./manage.py test
