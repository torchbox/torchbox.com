publicHoistPattern:
  - '*biome*'
  - '*prettier*'
  - '*stylelint*'
  - '@tailwindcss/*'
allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true
  esbuild: false
  '@tailwindcss/oxide': true
  stylelint-config-torchbox: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
minimumReleaseAge: 4320
overrides:
  # Jest declares glob ^13.0.6, and test-exclude, which it uses for coverage,
  # declares glob ^10.4.1 and minimatch ^10.2.2. Those ranges resolve to
  # releases with CVE-2026-118773 (glob) and CVE-2026-118764 (minimatch).
  # Remove these once they declare glob ^14 and minimatch ^11.
  glob: 14.0.4
  test-exclude>minimatch: 11.0.5
