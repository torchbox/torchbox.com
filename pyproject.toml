[tool.poetry]
name = "tbx"
version = "0.1.0"
description = "Torchbox.com"
authors = ["Torchbox Ltd"]

[tool.poetry.dependencies]
python = "^3.15"
Django = "~6.1"
wagtail = "~8.1"
psycopg = "~3.3"
gunicorn = "~26.2"
whitenoise = "~6.12"
Wand = "~0.7"
urllib3 = "~2.8"

# Django packages
django-basic-auth-ip-whitelist = "~0.8"
django-birdbath = "~2.0"
django-csp = "~4.0"
django-pattern-library = "~1.6"
django-permissions-policy = "~4.34"
django-redis = "~7.0"
django-storages = {extras = ["boto3"], version = "~1.14"}
dj-database-url = "~3.1"

# Wagtail packages
wagtail-accessibility = "~2.0"
wagtail-lite-youtube-embed = "~0.3"
wagtail-markdown = "~0.15"
wagtailmedia = "~0.19"
wagtail-purge = "~0.4"

# Production
scout-apm = "~4.1"
sentry-sdk = "~2.73"
html5lib = "~1.1"
beautifulsoup4 = "~4.15"
django-xff = "~1.5"

[tool.poetry.group.dev.dependencies]
Werkzeug = "~3.1"
django-debug-toolbar = "~8.0"
django-extensions = "~4.1"
fabric = "~3.2"
pudb = "~2026.1"
honcho = "~2.0"

# Linters etc.
detect-secrets = "~1.5"
django-upgrade = "~1.33"
djhtml = "~3.0"
pyupgrade = "~3.22"
pre-commit = "~4.6"
ruff = "~0.17"

# Documentation
mkdocs = "~1.6"
mkdocs-material = "~9.7"
pymdown-extensions = "~11.0"

# Testing
factory-boy = "~3.3"
faker = "~40.44"
wagtail-factories = "~4.5"
tblib = "~3.2"


[build-system]
requires = ["poetry>=1,<2"]
build-backend = "poetry.masonry.api"
