[project]
name = "tbx"
version = "0.1.0"
description = "Torchbox.com"
authors = [{name = "Torchbox Ltd"}]
requires-python = "~=3.15.0"
readme = "README.md"
dependencies = [
    "Django~=6.1.0",
    "wagtail~=8.1.0",
    "psycopg~=3.3.0",
    "gunicorn~=26.2.0",
    "whitenoise~=6.12.0",
    "Wand~=0.7.0",
    "urllib3~=2.8.0",
    "django-basic-auth-ip-whitelist~=0.8.0",
    "django-birdbath~=2.0.0",
    "django-csp~=4.0.0",
    "django-pattern-library~=1.6.0",
    "django-permissions-policy~=4.34.0",
    "django-redis~=7.0.0",
    "django-storages[boto3]~=1.14.0",
    "dj-database-url~=3.1.0",
    "wagtail-accessibility~=2.0.0",
    "wagtail-lite-youtube-embed~=0.3.0",
    "wagtail-markdown~=0.15.0",
    "wagtailmedia~=0.19.0",
    "wagtail-purge~=0.4.0",
    "scout-apm~=4.1.0",
    "sentry-sdk~=2.74.0",
    "html5lib~=1.1.0",
    "beautifulsoup4~=4.15.0",
    "django-xff~=1.5.0",
    "tzdata~=2026.6.0",
]

[dependency-groups]
dev = [
    "Werkzeug~=3.1.0",
    "django-debug-toolbar~=8.0.0",
    "django-extensions~=4.1.0",
    "fabric~=3.2.0",
    "pudb~=2026.1.0",
    "honcho~=2.0.0",
    "detect-secrets~=1.5.0",
    "django-upgrade~=1.33.0",
    "djhtml~=3.0.0",
    "pyupgrade~=3.22.0",
    "pre-commit~=4.7.0",
    "ruff~=0.17.0",
    "mkdocs~=1.6.0",
    "mkdocs-material~=9.8.0",
    "pymdown-extensions~=12.3.0",
    "factory-boy~=3.3.0",
    "faker~=40.44.0",
    "wagtail-factories~=4.5.0",
    "tblib~=3.2.0",
]

[tool.uv]
exclude-newer = "3 days"
required-version = ">=0.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
