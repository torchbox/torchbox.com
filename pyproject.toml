[tool.poetry]
name = "tbx"
version = "0.1.0"
description = "Torchbox.com"
authors = ["Torchbox Ltd"]

[tool.poetry.dependencies]
python = "^3.13"
Django = "~5.2"
wagtail = "~8.0"
psycopg = "~3.3"
gunicorn = "~26.0"
whitenoise = "~6.12"
phonenumbers = "~9.0"
Wand = "~0.7"
urllib3 = "~2.7"

# Django packages
django-basic-auth-ip-whitelist = "~0.8"
django-birdbath = "~2.0"
django-csp = "~4.0"
django-pattern-library = "~1.5"
django-permissions-policy = "~4.30"
django-phonenumber-field = "~8.4"
django-redis = "~6.0"
django-storages = {extras = ["boto3"], version = "~1.14"}
dj-database-url = "~3.1"

# Wagtail packages
wagtail-accessibility = "~2.0"
wagtail-ai = "~3.1"
wagtail-lite-youtube-embed = "~0.3"
wagtail-markdown = "~0.14"
wagtailmedia = "~0.17"
wagtail-purge = "~0.4"

# Production
scout-apm = "~3.5"
sentry-sdk = "~2.61"
html5lib = "~1.1"
beautifulsoup4 = "~4.14"
django-xff = "~1.5"

[tool.poetry.group.dev.dependencies]
Werkzeug = "~3.1"
django-debug-toolbar = "~6.3"
django-extensions = "~4.1"
fabric = "~3.2"
pudb = "~2025.1"
honcho = "~2.0"

# Linters etc.
detect-secrets = "~1.5"
django-upgrade = "~1.30"  # update pre-commit-config.yaml too
djhtml = "~3.0"          # update pre-commit-config.yaml too
pyupgrade = "~3.21"       # update pre-commit-config.yaml too
pre-commit = "~4.6"
ruff = "~0.15"           # update pre-commit-config.yaml too

# Documentation
mkdocs = "~1.6"
mkdocs-material = "~9.7"
pymdown-extensions = "~10.18"

# Testing
factory-boy = "~3.3"
faker = "~40.20"
wagtail-factories = "~4.4"
tblib = "~3.2"


[build-system]
requires = ["poetry>=1,<2"]
build-backend = "poetry.masonry.api"
